<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 뒤집기</title>
    <style>
      :root {
        --transition-speed: 0.6s;
        --card-width: 320px;

        --bg-color: #000000;
        --text-color: #ffffff;
      }

      body.light-mode {
        --bg-color: #ffffff;
        --text-color: #000000;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);

        transition:
          background-color 0.4s ease,
          color 0.4s ease;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        /* min-height: 100vh; */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card-container {
        width: 100%;
        max-width: var(--card-width);
        perspective: 1000px;
        cursor: pointer;
        background: transparent;
        touch-action: none;
      }

      .card {
        width: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
        background: transparent;
        border-radius: 16px;
      }

      .card.flipping {
        transition: transform var(--transition-speed)
          cubic-bezier(0.4, 0.2, 0.2, 1);
      }

      .card-face {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background: transparent;
        border: none;
        outline: none;
        position: relative;
      }

      .card-front {
        position: relative;
        transform: rotateY(0deg);
      }

      .card-back {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transform: rotateY(180deg);
      }

      .card-face img {
        width: 100%;
        height: auto;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        background: transparent;
      }

      .glare {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95%;
        height: 100%;
        border-radius: 35px;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: color-dodge;
        transition: opacity 0.3s ease;
        z-index: 10;

        background: linear-gradient(
          var(--glare-angle, 115deg),
          transparent 20%,
          rgba(255, 0, 150, 0.25) 35%,
          rgba(0, 255, 255, 0.35) 50%,
          rgba(255, 230, 0, 0.25) 65%,
          transparent 80%
        );
        background-size: 200% 200%;
        background-position: var(--glare-x, 50%) var(--glare-y, 50%);
      }

      .card-container:hover .glare {
        opacity: 1;
      }

      .fallback-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1rem;
        color: #64748b;
        pointer-events: none;
        z-index: -1;
      }

      .card-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
      }

      .card-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 17px;
      }

      .theme-toggle {
        flex-shrink: 0;

        width: 48px;
        height: 48px;

        border: none;
        border-radius: 50%;

        background: rgba(255, 255, 255, 0.12);
        color: var(--text-color);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 22px;
        cursor: pointer;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        transition:
          background-color 0.3s ease,
          transform 0.2s ease,
          color 0.3s ease;
      }

      .theme-toggle:hover {
        transform: scale(1.08);
      }

      .theme-toggle:active {
        transform: scale(0.92);
      }

      body.light-mode .theme-toggle {
        background: rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="card-row">
      <div
        class="card-container"
        id="cardContainer"
        tabindex="0"
        role="button"
        aria-label="카드"
      >
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="fallback-text">앞면</span>
            <img
              src="../images/ramzifront.png"
              alt="카드 앞면"
              onerror="this.style.display = 'none'"
            />
            <div class="glare"></div>
          </div>

          <div class="card-face card-back">
            <span class="fallback-text">뒷면</span>
            <img
              src="../images/ramziback.png"
              alt="카드 뒷면"
              onerror="this.style.display = 'none'"
            />
            <div class="glare"></div>
          </div>
        </div>
      </div>
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="밝은 테마로 변경"
      >
        ☀️
      </button>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cardContainer = document.getElementById("cardContainer");
        const card = document.getElementById("card");
        const glares = document.querySelectorAll(".glare");
        const themeToggle = document.getElementById("themeToggle");

        let isFlipped = false;
        let isTouching = false;
        let flipTimer = null;

        const toggleFlip = () => {
          if (card.classList.contains("flipping")) return;

          isFlipped = !isFlipped;

          card.classList.add("flipping");

          updateTransform(0, 0);

          clearTimeout(flipTimer);

          flipTimer = setTimeout(() => {
            card.classList.remove("flipping");
          }, 600);
        };

        const updateCardFromPosition = (clientX, clientY) => {
          if (card.classList.contains("flipping")) return;

          const rect = cardContainer.getBoundingClientRect();

          const x = clientX - rect.left;
          const y = clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = -((y - centerY) / centerY) * 15;
          const rotateY = ((x - centerX) / centerX) * 15;

          updateTransform(rotateX, rotateY);

          const posX = (x / rect.width) * 100;
          const posY = (y / rect.height) * 100;

          const angle =
            Math.atan2(y - centerY, x - centerX) * (180 / Math.PI) + 90;

          glares.forEach((glare) => {
            glare.style.setProperty("--glare-x", `${posX}%`);
            glare.style.setProperty("--glare-y", `${posY}%`);
            glare.style.setProperty("--glare-angle", `${angle}deg`);
          });
        };

        const updateTransform = (rotateX, rotateY) => {
          const baseRotateY = isFlipped ? 180 : 0;

          const currentRotateY = isFlipped ? baseRotateY - rotateY : rotateY;

          card.style.transform = `rotateX(${rotateX}deg) rotateY(${currentRotateY}deg)`;
        };

        const handleMouseMove = (e) => {
          updateCardFromPosition(e.clientX, e.clientY);
        };

        const handleMouseLeave = () => {
          if (card.classList.contains("flipping")) return;

          updateTransform(0, 0);
        };

        const handleTouchStart = (e) => {
          if (card.classList.contains("flipping")) return;

          isTouching = true;

          const touch = e.touches[0];

          updateCardFromPosition(touch.clientX, touch.clientY);
        };

        const handleTouchMove = (e) => {
          if (!isTouching) return;
          if (card.classList.contains("flipping")) return;

          const touch = e.touches[0];

          updateCardFromPosition(touch.clientX, touch.clientY);
        };

        const handleTouchEnd = () => {
          if (!isTouching) return;

          isTouching = false;

          if (card.classList.contains("flipping")) return;

          updateTransform(0, 0);
        };

        themeToggle.addEventListener("click", (e) => {
          e.stopPropagation();

          document.body.classList.toggle("light-mode");

          const isLightMode = document.body.classList.contains("light-mode");

          themeToggle.textContent = isLightMode ? "🌙" : "☀️";

          themeToggle.setAttribute(
            "aria-label",
            isLightMode ? "어두운 테마로 변경" : "밝은 테마로 변경",
          );
        });

        // PC
        cardContainer.addEventListener("mousemove", handleMouseMove);

        cardContainer.addEventListener("mouseleave", handleMouseLeave);

        // 모바일
        cardContainer.addEventListener("touchstart", handleTouchStart, {
          passive: true,
        });

        cardContainer.addEventListener("touchmove", handleTouchMove, {
          passive: true,
        });

        cardContainer.addEventListener("touchend", handleTouchEnd);

        // 클릭 / 탭으로 뒤집기
        cardContainer.addEventListener("click", toggleFlip);

        // 키보드
        cardContainer.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleFlip();
          }
        });
      });
    </script>
  </body>
</html>
