<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Flip Interactive with Hologram</title>
    <style>
        :root {
            --transition-speed: 0.6s;
            --card-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {            
            background-color: #0f172a; /* 빛 효과 감상을 위해 어두운 배경 추천 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .card-container {
            width: 100%;
            max-width: var(--card-width);
            perspective: 1000px;
            cursor: pointer;
            background: transparent;
        }
        
        .card {
            width: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* 마우스 호버 이동 시 부드러운 기울임을 위해 transition 조절 */
            transition: transform 0.1s ease-out;
            background: transparent;
            border-radius: 16px;
        }

        /* 뒤집기 애니메이션 진행 시 지정 속도 적용 */
        .card.flipping {
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped {
            /* JS에서 rotateY(180deg) 기반으로 제어 */
        }
        
        .card-face {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: transparent;
            border: none;
            outline: none;
            position: relative;
        }
        
        .card-front {
            position: relative;
            transform: rotateY(0deg);
        }
        
        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            transform: rotateY(180deg);
        }
        
        .card-face img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            background: transparent;
        }

        /* 홀로그램 & 반짝이 오버레이 레이어 */
        .glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: color-dodge; /* 포켓몬 카드 특유의 반사 효과 */
            transition: opacity 0.3s ease;
            z-index: 10;
            
            /* 무지개빛 홀로그램 그래디언트 */
            background: linear-gradient(
                var(--glare-angle, 115deg),
                transparent 20%,
                rgba(255, 0, 150, 0.25) 35%,
                rgba(0, 255, 255, 0.35) 50%,
                rgba(255, 230, 0, 0.25) 65%,
                transparent 80%
            );
            background-size: 200% 200%;
            background-position: var(--glare-x, 50%) var(--glare-y, 50%);
        }

        /* 마우스 호버 시 광택 활성화 */
        .card-container:hover .glare {
            opacity: 1;
        }

        .fallback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            color: #64748b;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer" tabindex="0" role="button" aria-label="카드">
        <div class="card" id="card">            
            <!-- 앞면 -->
            <div class="card-face card-front">
                <span class="fallback-text">앞면</span>
                <img src="../images/naofront.png" alt="카드 앞면" onerror="this.style.display='none'">
                <div class="glare"></div>
            </div>
            <!-- 뒷면 -->
            <div class="card-face card-back">
                <span class="fallback-text">뒷면</span>
                <img src="../images/naoback.png" alt="카드 뒷면" onerror="this.style.display='none'">
                <div class="glare"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardContainer = document.getElementById('cardContainer');
            const card = document.getElementById('card');
            const glares = document.querySelectorAll('.glare');

            let isFlipped = false;

            // 카드 클릭 및 뒤집기
            const toggleFlip = () => {
                isFlipped = !isFlipped;
                card.classList.add('flipping');
                
                // 뒤집기 상태 적용
                updateTransform(0, 0);

                setTimeout(() => {
                    card.classList.remove('flipping');
                }, 600);
            };

            // 마우스 이동 시 3D Tilt 및 홀로그램 좌표 계산
            const handleMouseMove = (e) => {
                if (card.classList.contains('flipping')) return;

                const rect = cardContainer.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  

                // -1 ~ 1 사이 비율 계산
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = -((y - centerY) / centerY) * 15; // 최대 기울기 각도 15deg
                const rotateY = ((x - centerX) / centerX) * 15;

                updateTransform(rotateX, rotateY);

                // 홀로그램 위치 및 각도 업데이트
                const posX = (x / rect.width) * 100;
                const posY = (y / rect.height) * 100;
                const angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI) + 90;

                glares.forEach(glare => {
                    glare.style.setProperty('--glare-x', `${posX}%`);
                    glare.style.setProperty('--glare-y', `${posY}%`);
                    glare.style.setProperty('--glare-angle', `${angle}deg`);
                });
            };

            // Transform 적용 함수
            const updateTransform = (rotateX, rotateY) => {
                const baseRotateY = isFlipped ? 180 : 0;
                // 뒤집힘 상태에 따라 Y축 기울기 방향 반전 제어
                const currentRotateY = isFlipped ? baseRotateY - rotateY : rotateY;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${currentRotateY}deg)`;
            };

            // 마우스 이탈 시 원위치
            const handleMouseLeave = () => {
                if (card.classList.contains('flipping')) return;
                card.style.transition = 'transform 0.5s ease-out';
                updateTransform(0, 0);
                setTimeout(() => {
                    card.style.transition = 'transform 0.1s ease-out';
                }, 500);
            };

            cardContainer.addEventListener('click', toggleFlip);
            cardContainer.addEventListener('mousemove', handleMouseMove);
            cardContainer.addEventListener('mouseleave', handleMouseLeave);

            cardContainer.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleFlip();
                }
            });
        });
    </script>
</body>
</html>
