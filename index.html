<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Flip Interactive</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-width: 320px;
            --border-radius: 16px;
            --transition-speed: 0.6s;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .instruction {
            margin-bottom: 24px;
            font-size: 1.1rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
            text-align: center;
        }

        /* 3D 공간 설정을 위한 원근감(perspective) 컨테이너 */
        .card-container {
            width: 100%;
            max-width: var(--card-width);
            perspective: 1000px;
            cursor: pointer;
        }

        /* 3:4 비율을 유지하는 카드 */
        .card {
            width: 100%;
            aspect-ratio: 3 / 4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        /* 호버 시 그림자 살짝 커지는 효과 */
        .card-container:hover .card {
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.6), 0 12px 15px -6px rgba(0, 0, 0, 0.4);
        }

        /* 뒤집혔을 때의 상태 (Y축 180도 회전) */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 카드 앞/뒷면 공통 스타일 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 앞면 설정 */
        .card-front {
            transform: rotateY(0deg);
        }

        /* 뒷면 설정 (초기에 180도 회전시켜둠) */
        .card-back {
            transform: rotateY(180deg);
        }

        /* 이미지 로드 전 또는 경로 오류 시 가이드 텍스트 */
        .fallback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            color: #64748b;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer" tabindex="0" role="button" aria-label="카드 뒤집기">
        <div class="card" id="card">
            <!-- 앞면 -->
            <div class="card-face card-front">
                <span class="fallback-text">앞면 이미지 (front.png)</span>
                <img src="./images/front.png" alt="카드 앞면" onerror="this.style.display='none'">
            </div>
            <!-- 뒷면 -->
            <div class="card-face card-back">
                <span class="fallback-text">뒷면 이미지 (back.png)</span>
                <img src="./images/back.png" alt="카드 뒷면" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardContainer = document.getElementById('cardContainer');
            const card = document.getElementById('card');

            // 카드 토글 함수
            const toggleFlip = () => {
                card.classList.toggle('flipped');
            };

            // 마우스 클릭 이벤트
            cardContainer.addEventListener('click', toggleFlip);

            // 키보드 접근성 (Space 또는 Enter 키)
            cardContainer.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleFlip();
                }
            });
        });
    </script>
</body>
</html>
